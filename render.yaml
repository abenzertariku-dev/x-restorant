services:
  - type: web
    name: restaurant-next
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - {key: SESSION_SECRET, generateValue: true}
      - {key: WAITER_KEY, value: "1111"}
      - {key: MANAGER_KEY, value: "2222"}
      - {key: DRIVER_KEY, value: "3333"}
